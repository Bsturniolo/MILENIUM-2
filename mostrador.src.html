<style>
/* Layout: barra superior con estado del turno, pestañas, y una mesa de trabajo por pestaña (Vender = buscador + ticket lado a lado). */

.pasos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}

/* ---- Identidad: banda "espacio" con el planeta, acentos azul, turquesa, violeta y dorado ---- */

<script>
(() => {
'use strict';
// ---------- estado ----------
const S = { equipos: [], eqPago: null, eqEdit: null, eqNuevo: false, productos: [], ventas: [], movs: [], turnos: [], contadores: {}, carrito: [], pago: 'Efectivo', buscar: '', filtroProd: '', kardexProd: '', rango: 'hoy', editId: null, confirm: null, loaded: false, db: null, prodForm: null, clientes: [], ctacte: [], presupuestos: [], remitos: [], proveedores: [], compras: [], ctaprov: [], clienteVenta: '', presupuestoOrigen: null, cliTab: 'clientes', cliSel: null, cliEdit: null, filtroCli: '', cprTab: 'nueva', compraLineas: [], compraCab: { prov: '', comp: '', pago: 'A cuenta corriente' }, provSel: null, provEdit: null, vRango: 'hoy', vOrigen: 'todas', ventaSel: null, webReintentar: [], webUltima: 0, webError: '' };
const MEDIOS = ['Efectivo', 'Débito', 'Crédito', 'Transferencia', 'QR Mercado Pago'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const r3 = n => Math.round((Number(n) || 0) * 1000) / 1000;
const fmt = n => '$ ' + r2(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fq = n => r3(n).toLocaleString('es-AR', { maximumFractionDigits: 3 });
const fecha = ts => new Date(ts).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); };
const prod = id => S.productos.find(p => p.id === id);
const turnoAbierto = () => S.turnos.find(t => t.estado === 'abierto');
const activos = () => S.productos.filter(p => p.activo !== false).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

// ---------- vistas ----------
const vistas = ['vender', 'ventas', 'productos', 'stock', 'clientes', 'compras', 'equipos', 'caja', 'reportes'];
const vistaActual = () => { const h = location.hash.slice(1); return vistas.includes(h) ? h : 'vender'; };

function render() {
  // Si se pide dibujar mientras se está dibujando (un campo que pierde el foco), se deja para después.
  if (render.ocupado) { clearTimeout(render.h); render.h = setTimeout(render, 0); return; }
  render.ocupado = true;
  try { dibujar(); } finally { render.ocupado = false; }
}
function dibujar() {
  const v = vistaActual();
  document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#' + v ? 'page' : 'false'));
  const t = turnoAbierto();
  const et = $('#estadoTurno');
  if (!S.loaded) { et.className = 'pill off'; et.textContent = 'Cargando…'; }
  else if (t) { et.className = 'pill ok'; et.textContent = 'Turno abierto · ' + fecha(t.apertura); }
  else { et.className = 'pill off'; et.textContent = 'Caja cerrada'; }
  const focused = document.activeElement && document.activeElement.id;
  const caret = focused && document.activeElement.selectionStart;
  $('#vista').innerHTML = ({ vender: vVender, ventas: vVentas, productos: vProductos, stock: vStock, clientes: vClientes, compras: vCompras, equipos: vEquipos, caja: vCaja, reportes: vReportes })[v]();
  if (focused) {
    const el = document.getElementById(focused);
    if (el) {
      el.focus();
      // Los campos de número no guardan la posición del cursor: se deja al final para que se escriba de izquierda a derecha.
      if (el.type === 'number') { const v = el.value; if (v !== '') { el.value = ''; el.value = v; } }
      else try { if (caret != null) el.setSelectionRange(caret, caret); } catch (e) {}
    }
  }
}

// Textos que cambian mientras se escribe un número (se actualizan solos, sin redibujar el formulario).
const txtVuelto = (pagaCon, total) => pagaCon > total ? fmt(pagaCon - total) : '—';
function txtMargen(f) { const m = Number(f.costo) > 0 && Number(f.precio) > 0 ? Math.round((Number(f.precio) / Number(f.costo) - 1) * 100) : null; return m != null ? `Ganancia sobre el costo: <b class="num">${m} %</b>` : 'Cargá costo y precio para ver la ganancia.'; }
const txtDif = dif => dif == null ? '<span class="muted tiny">Escribí lo contado para ver si sobra o falta.</span>' : dif === 0 ? '<span class="pill ok">Caja justa</span>' : dif > 0 ? `<span class="pill off">Sobran ${fmt(dif)}</span>` : `<span class="pill bad">Faltan ${fmt(-dif)}</span>`;

// ----- Vender -----
function buscarProductos(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  return activos().filter(p => p.nombre.toLowerCase().includes(q) || (p.codigos || []).some(c => String(c).toLowerCase() === q || String(c).toLowerCase().startsWith(q)) || (p.rubro || '').toLowerCase().includes(q)).slice(0, 30);
}
function totales() {
  const total = r2(S.carrito.reduce((s, i) => s + i.precio * i.cant, 0));
  const costo = r2(S.carrito.reduce((s, i) => s + i.costo * i.cant, 0));
  return { total, costo };
}
function vVender() {
  const res = buscarProductos(S.buscar);
  const { total } = totales();
  const t = turnoAbierto();
  const pagaCon = Number(($('#pagaCon') || {}).value || 0);
  return `<div class="grid2">
  <section class="panel">
    <h2>Buscar o escanear</h2>
    <input id="buscar" class="scan" placeholder="Código de barras o nombre, y Enter" value="${esc(S.buscar)}" autocomplete="off" aria-label="Buscar producto">
    <div class="results">${S.buscar && !res.length ? '<p class="muted">No hay productos con ese nombre o código.</p>' : ''}
      ${res.map(p => `<button class="result" data-add="${p.id}"><span>${esc(p.nombre)}<br><span class="meta">${esc(p.rubro || 'Sin rubro')} · ${p.controlaStock === false ? 'sin control de stock' : 'stock ' + fq(p.stock)}</span></span><span class="money">${fmt(p.precio)}</span></button>`).join('')}
    </div>
    ${!S.buscar ? `<h3 style="margin-top:16px">Más vendidos</h3><div class="chips">${masVendidos(8).map(p => `<button class="chip" data-add="${p.id}">${esc(p.nombre)}</button>`).join('') || '<span class="muted tiny">Aparecen cuando haya ventas.</span>'}</div>` : ''}
  </section>
  <aside class="ticket" aria-label="Ticket">
    <h2>Ticket</h2>
    ${S.carrito.length ? `<div class="tablebox"><table><thead><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Importe</th><th></th></tr></thead><tbody>
      ${S.carrito.map((i, k) => `<tr><td>${esc(i.nombre)}<br><span class="tiny muted money">${fmt(i.precio)} c/u</span></td>
      <td class="r"><input class="qty" type="number" min="0" step="${i.porPeso ? '0.001' : '1'}" value="${i.cant}" data-qty="${k}" aria-label="Cantidad de ${esc(i.nombre)}"></td>
      <td class="r money">${fmt(i.precio * i.cant)}</td><td><button class="small" data-del="${k}" aria-label="Quitar ${esc(i.nombre)}">✕</button></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">Escaneá o buscá un producto para empezar la venta.</div>'}
    <div class="total"><span>Total</span><strong>${fmt(total)}</strong></div>
    <div class="stack" style="margin-top:14px;gap:12px">
      ${S.presupuestoOrigen ? `<div class="notice">Cargado del presupuesto N° ${nro((S.presupuestos.find(p => p.id === S.presupuestoOrigen) || {}).numero)}.</div>` : ''}
      <label>Cliente<select id="ventaCli"><option value="">Consumidor final</option>${clientesActivos().map(c => `<option value="${c.id}" ${S.clienteVenta === c.id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select></label>
      ${S.clienteVenta && cli(S.clienteVenta) ? `<span class="tiny muted" style="margin-top:-6px">Debe ${fmt(Math.max(0, saldoCli(S.clienteVenta)))}${cli(S.clienteVenta).limite > 0 ? ' · límite ' + fmt(cli(S.clienteVenta).limite) : ''}</span>` : ''}
      <div class="chips" role="group" aria-label="Medio de pago">${MEDIOS.map(m => `<button class="chip" data-pago="${m}" aria-pressed="${S.pago === m}">${m}</button>`).join('')}</div>
      ${S.pago === 'Efectivo' ? `<div class="row"><label style="flex:1">Paga con<input id="pagaCon" type="number" min="0" step="0.01" inputmode="decimal" value="${pagaCon || ''}"></label><div style="flex:1"><span class="tiny muted">Vuelto</span><div id="vueltoTxt" class="money" style="font-size:20px">${txtVuelto(pagaCon, total)}</div></div></div>` : ''}
      ${!t && S.loaded ? '<div class="notice">Para cobrar, primero abrí la caja en la pestaña <a href="#caja">Caja</a>.</div>' : ''}
      <button class="primary big" id="cobrar" ${!S.carrito.length || !t ? 'disabled' : ''}>Cobrar ${S.carrito.length ? fmt(total) : ''}</button>
      ${S.carrito.length ? `<div class="row"><button id="guardarPresu">Guardar presupuesto</button><button id="hacerRemito" ${!S.clienteVenta ? 'disabled title="Elegí el cliente"' : ''}>Remito a cuenta corriente</button></div><button id="vaciar">Cancelar venta</button>` : ''}
    </div>
  </aside></div>`;
}
function masVendidos(n) {
  const c = {};
  S.ventas.filter(v => !v.anulada).slice(0, 300).forEach(v => (v.items || []).forEach(i => c[i.productoId] = (c[i.productoId] || 0) + i.cant));
  return Object.entries(c).sort((a, b) => b[1] - a[1]).map(([id]) => prod(id)).filter(p => p && p.activo !== false).slice(0, n);
}
function agregar(id) {
  const p = prod(id); if (!p) return;
  const ya = S.carrito.find(i => i.productoId === id);
  if (ya) ya.cant = r3(ya.cant + 1);
  else S.carrito.push({ productoId: id, nombre: p.nombre, precio: r2(p.precio), costo: r2(p.costo), cant: 1, porPeso: !!p.porPeso });
  if (p.controlaStock !== false) { const c = S.carrito.find(i => i.productoId === id).cant; if (c > (p.stock || 0)) toast('Ojo: quedan ' + fq(p.stock || 0) + ' de ' + p.nombre); }
  S.buscar = ''; render(); const b = $('#buscar'); if (b) b.focus();
}
async function cobrar() {
  const t = turnoAbierto();
  if (!S.carrito.length || !t || !S.db) return;
  const btn = $('#cobrar'); if (btn) btn.disabled = true;
  const items = S.carrito.filter(i => i.cant > 0).map(i => ({ productoId: i.productoId, nombre: i.nombre, cant: r3(i.cant), precio: i.precio, costo: i.costo }));
  if (!items.length) { render(); return; }
  const total = r2(items.reduce((s, i) => s + i.precio * i.cant, 0));
  const costo = r2(items.reduce((s, i) => s + i.costo * i.cant, 0));
  const numero = (S.contadores.venta || 0) + 1;
  const ts = Date.now();
  try {
    await S.db.doc('config/contadores').set({ ...S.contadores, venta: numero });
    const c = cli(S.clienteVenta);
    const ref = await S.db.collection('ventas').add({ numero, ts, items, total, costo, pago: S.pago, turnoId: t.id, anulada: false, clienteId: c ? c.id : '', clienteNombre: c ? c.nombre : '' });
    if (S.presupuestoOrigen) await S.db.doc('presupuestos/' + S.presupuestoOrigen).update({ estado: 'vendido', ventaId: ref.id });
    await moverStock(items.map(i => ({ productoId: i.productoId, nombre: i.nombre, cant: -i.cant })), 'Venta', 'Venta N° ' + numero, ref.id, ts);
    S.carrito = []; S.buscar = ''; S.presupuestoOrigen = null; S.clienteVenta = ''; render(); toast('Venta N° ' + numero + ' cobrada: ' + fmt(total));
  } catch (e) { fallo(e); render(); }
}
// Cambia stock de varios productos y deja una línea en el kardex.
async function moverStock(lineas, tipo, detalle, ref, ts) {
  const conStock = lineas.filter(l => { const p = prod(l.productoId); return p && p.controlaStock !== false && l.cant !== 0; });
  for (const l of conStock) { const p = prod(l.productoId); p.stock = r3((p.stock || 0) + l.cant); await S.db.doc('productos/' + p.id).update({ stock: p.stock }); }
  if (conStock.length) await S.db.collection('movimientos').add({ ts: ts || Date.now(), tipo, detalle, ref: ref || '', lineas: conStock.map(l => ({ productoId: l.productoId, nombre: l.nombre, cant: r3(l.cant), saldo: prod(l.productoId).stock })) });
}

// ----- Productos -----
function vProductos() {
  const q = S.filtroProd.trim().toLowerCase();
  const lista = activos().filter(p => !q || p.nombre.toLowerCase().includes(q) || (p.rubro || '').toLowerCase().includes(q) || (p.codigos || []).some(c => String(c).includes(q)));
  const e = S.editId ? prod(S.editId) : null;
  const f = S.prodForm || (e ? { ...e, codigos: (e.codigos || []).join(', ') } : { nombre: '', codigos: '', rubro: '', costo: '', precio: '', iva: 21, stock: '', minimo: '', controlaStock: true, porPeso: false });
  const margen = Number(f.costo) > 0 && Number(f.precio) > 0 ? Math.round((Number(f.precio) / Number(f.costo) - 1) * 100) : null;
  const rubros = [...new Set(S.productos.map(p => p.rubro).filter(Boolean))].sort();
  const ejemplos = S.productos.filter(p => p.ejemplo && p.activo !== false).length;
  return `<div class="grid2">
  <section class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Productos <span class="tag">${lista.length}</span></h2>
    <input id="filtroProd" placeholder="Buscar por nombre, rubro o código" value="${esc(S.filtroProd)}" style="max-width:280px" aria-label="Filtrar productos"></div>
    ${ejemplos ? `<div class="notice" style="margin-bottom:10px">Hay ${ejemplos} productos de ejemplo para probar. <button class="small" id="borrarEjemplos">Borrar ejemplos</button></div>` : ''}
    ${S.confirm && S.confirm.tipo === 'ejemplos' ? `<div class="confirm">¿Borrar los ${ejemplos} productos de ejemplo? <button class="small danger" id="okEjemplos">Sí, borrar</button><button class="small" data-cancel>No</button></div>` : ''}
    ${lista.length ? `<div class="tablebox"><table><thead><tr><th>Producto</th><th>Rubro</th><th class="r">Costo</th><th class="r">Precio</th><th class="r">Stock</th></tr></thead><tbody>
    ${lista.map(p => `<tr class="click" data-edit="${p.id}" tabindex="0"><td>${esc(p.nombre)}${p.ejemplo ? ' <span class="tag">ejemplo</span>' : ''}<br><span class="tiny muted num">${esc((p.codigos || []).join(' · '))}</span></td><td>${esc(p.rubro || '—')}</td><td class="r money">${fmt(p.costo)}</td><td class="r money">${fmt(p.precio)}</td>
    <td class="r num">${p.controlaStock === false ? '<span class="tag">no controla</span>' : (p.stock <= (p.minimo || 0) ? `<span class="tag bad">${fq(p.stock)}</span>` : fq(p.stock))}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">${S.loaded ? 'Todavía no hay productos. Cargá el primero con el formulario.' : 'Cargando productos…'}</div>`}
  </section>
  <section class="panel"><h2>${e ? 'Editar producto' : 'Nuevo producto'}</h2>
    <form id="prodForm" class="form">
      <label class="full">Nombre<input id="pf_nombre" required value="${esc(f.nombre)}"></label>
      <label class="full">Códigos de barra (separados por coma)<input id="pf_codigos" value="${esc(f.codigos)}" inputmode="numeric"></label>
      <label>Rubro<input id="pf_rubro" list="rubros" value="${esc(f.rubro)}"><datalist id="rubros">${rubros.map(r => `<option value="${esc(r)}">`).join('')}</datalist></label>
      <label>IVA<select id="pf_iva">${[21, 10.5, 27, 0].map(x => `<option value="${x}" ${Number(f.iva) === x ? 'selected' : ''}>${String(x).replace('.', ',')} %</option>`).join('')}</select></label>
      <label>Costo ($)<input id="pf_costo" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(f.costo)}"></label>
      <label>Precio de venta ($)<input id="pf_precio" type="number" min="0" step="0.01" inputmode="decimal" required value="${esc(f.precio)}"></label>
      <div id="margenTxt" class="full tiny muted">${txtMargen(f)}</div>
      ${e ? '' : `<label>Stock inicial<input id="pf_stock" type="number" min="0" step="0.001" value="${esc(f.stock)}"></label>`}
      <label>Stock mínimo<input id="pf_minimo" type="number" min="0" step="0.001" value="${esc(f.minimo)}"></label>
      <label class="check full"><input id="pf_controla" type="checkbox" ${f.controlaStock !== false ? 'checked' : ''}> Controla stock</label>
      <label class="check full"><input id="pf_peso" type="checkbox" ${f.porPeso ? 'checked' : ''}> Se vende por peso o fraccionado (permite cantidades con decimales)</label>
      <div class="row full"><button class="primary" type="submit">${e ? 'Guardar cambios' : 'Agregar producto'}</button>${e ? '<button type="button" id="cancelEdit">Cancelar</button><button type="button" class="danger" id="bajaProd">Dar de baja</button>' : ''}</div>
      ${e ? '<p class="tiny muted full">Para cambiar el stock usá la pestaña Stock, así queda registrado el motivo.</p>' : ''}
    </form>
    ${S.confirm && S.confirm.tipo === 'baja' ? `<div class="confirm">¿Dar de baja "${esc(e && e.nombre)}"? Deja de aparecer para vender; las ventas viejas no cambian. <button class="small danger" id="okBaja">Sí, dar de baja</button><button class="small" data-cancel>No</button></div>` : ''}
  </section></div>`;
}
function leerForm() {
  const v = id => (document.getElementById(id) || {}).value;
  const c = id => !!(document.getElementById(id) || {}).checked;
  return { nombre: v('pf_nombre') || '', codigos: v('pf_codigos') || '', rubro: v('pf_rubro') || '', iva: Number(v('pf_iva') || 21), costo: v('pf_costo') ?? '', precio: v('pf_precio') ?? '', stock: v('pf_stock') ?? '', minimo: v('pf_minimo') ?? '', controlaStock: c('pf_controla'), porPeso: c('pf_peso') };
}
async function guardarProducto() {
  const f = leerForm();
  const nombre = f.nombre.trim();
  if (!nombre) return toast('Falta el nombre del producto');
  if (!(Number(f.precio) > 0)) return toast('Falta el precio de venta');
  const codigos = f.codigos.split(',').map(s => s.trim()).filter(Boolean);
  const dup = codigos.find(cod => S.productos.some(p => p.id !== S.editId && p.activo !== false && (p.codigos || []).includes(cod)));
  if (dup) return toast('El código ' + dup + ' ya está en otro producto');
  const data = { nombre, codigos, rubro: f.rubro.trim(), iva: f.iva, costo: r2(f.costo), precio: r2(f.precio), minimo: r3(f.minimo), controlaStock: f.controlaStock, porPeso: f.porPeso, activo: true, modificado: Date.now() };
  try {
    if (S.editId) {
      const antes = prod(S.editId);
      await S.db.doc('productos/' + S.editId).update(data);
      if (antes && (antes.precio !== data.precio || antes.costo !== data.costo)) await S.db.collection('auditoria').add({ ts: Date.now(), detalle: `Precio de ${nombre}`, antes: `costo ${fmt(antes.costo)} / precio ${fmt(antes.precio)}`, despues: `costo ${fmt(data.costo)} / precio ${fmt(data.precio)}` });
      toast('Guardado: ' + nombre);
    } else {
      const stock = r3(f.stock);
      const ref = await S.db.collection('productos').add({ ...data, stock: 0, creado: Date.now() });
      S.productos.push({ id: ref.id, ...data, stock: 0 });
      if (stock && data.controlaStock) await moverStock([{ productoId: ref.id, nombre, cant: stock }], 'Stock inicial', 'Alta del producto');
      toast('Agregado: ' + nombre);
    }
    S.editId = null; S.prodForm = null; render();
  } catch (e) { fallo(e); }
}

// ----- Stock -----

  const ps = activos();
  const opts = sel => ps.map(p => `<option value="${p.id}" ${sel === p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('');
  const movs = S.movs.filter(m => !S.kardexProd || (m.lineas || []).some(l => l.productoId === S.kardexProd)).slice(0, 150);
  const bajo = ps.filter(p => p.controlaStock !== false && (p.stock || 0) <= (p.minimo || 0));
  return `<div class="grid3">
  <section class="panel"><h2>Ingreso de mercadería</h2><p class="muted" style="margin-top:-6px">Lo que llega del proveedor se carga en <a href="#compras">Compras</a>: suma el stock, actualiza el costo y queda la deuda con el proveedor.</p>
    <p style="margin:0"><a href="#compras">Ir a Compras →</a></p></section>
  <section class="panel"><h2>Ajuste de inventario</h2><p class="tiny muted" style="margin-top:-6px">Cuando contás y no coincide: roturas, vencidos, diferencias.</p>
    <form id="ajusteForm" class="form">
      <label class="full">Producto<select id="aj_prod" required><option value="">Elegí un producto</option>${opts('')}</select></label>
      <label>Stock real contado<input id="aj_real" type="number" min="0" step="0.001" required></label>
      <label>Motivo<select id="aj_mot"><option>Recuento</option><option>Rotura</option><option>Vencido</option><option>Robo o faltante</option><option>Otro</option></select></label>
      <div class="full"><button class="primary" type="submit">Guardar ajuste</button></div>
    </form></section>
  <section class="panel"><h2>Para reponer <span class="tag ${bajo.length ? 'bad' : 'good'}">${bajo.length}</span></h2>
    ${bajo.length ? `<table><tbody>${bajo.map(p => `<tr><td>${esc(p.nombre)}</td><td class="r num">${fq(p.stock)} <span class="tiny muted">/ mín. ${fq(p.minimo || 0)}</span></td></tr>`).join('')}</tbody></table>` : '<p class="muted">Ningún producto está por debajo del mínimo.</p>'}
  </section></div>
  <section class="panel" style="margin-top:16px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Movimientos de stock (kardex)</h2>
    <select id="kardexProd" style="max-width:280px" aria-label="Filtrar por producto"><option value="">Todos los productos</option>${opts(S.kardexProd)}</select></div>
    ${movs.length ? `<div class="tablebox"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th class="r">Entrada</th><th class="r">Salida</th><th class="r">Saldo</th><th>Detalle</th></tr></thead><tbody>
    ${movs.flatMap(m => (m.lineas || []).filter(l => !S.kardexProd || l.productoId === S.kardexProd).map(l => `<tr><td class="num">${fecha(m.ts)}</td><td><span class="tag ${m.tipo.startsWith('Venta') ? 'acc' : m.tipo === 'Ingreso' ? 'good' : m.tipo.startsWith('Ajuste') ? 'warn' : ''}">${esc(m.tipo)}</span></td><td>${esc(l.nombre)}</td>
      <td class="r num">${l.cant > 0 ? fq(l.cant) : ''}</td><td class="r num">${l.cant < 0 ? fq(-l.cant) : ''}</td><td class="r num">${fq(l.saldo)}</td><td class="tiny muted">${esc(m.detalle)}</td></tr>`)).join('')}
    </tbody></table></div>` : '<div class="empty">Cada venta, ingreso o ajuste queda anotado acá con su motivo.</div>'}
  </section>`;
}
async function guardarAjuste() {
  const id = $('#aj_prod').value, real = $('#aj_real').value, mot = $('#aj_mot').value;
  const p = prod(id); if (!p || real === '') return toast('Elegí un producto y el stock contado');
  if (p.controlaStock === false) return toast('Ese producto no controla stock');
  const dif = r3(Number(real) - (p.stock || 0));
  if (!dif) return toast('El stock ya coincide, no hay nada que ajustar');
  try { await moverStock([{ productoId: id, nombre: p.nombre, cant: dif }], 'Ajuste', mot + ` (había ${fq(p.stock)}, se contaron ${fq(real)})`); toast('Ajuste guardado'); render(); } catch (e) { fallo(e); }
}

// ----- Equipos (máquinas que se activan al pagar) -----
const TIPOS_EQ = ['Lavarropas', 'Secarropas', 'Cafetera', 'Aspiradora', 'Hidrolavadora', 'Expendedora', 'Otro'];
const eq = id => S.equipos.find(x => x.id === id);
const mmss = ms => { const t = Math.ceil(ms / 1000), m = Math.floor(t / 60), s = t % 60; return m + ':' + String(s).padStart(2, '0'); };
const precioEq = (x, min) => r2(x.modo === 'minuto' ? x.precio * min : x.precio);
const GUIA_URL = 'https://github.com/Bsturniolo/MILENIUM-2/blob/main/modulos/FALTA-PARTE-FISICA.md';

// --- conexión con el servidor de módulos (se guarda solo en este navegador)
S.eqTab = 'maquinas'; S.srvEquipos = {}; S.srvOk = null; S.srvError = ''; S.srvAlertas = []; S.vinculo = null;
S.srv = (() => { try { const v = JSON.parse(localStorage.getItem('milenium-servidor') || 'null'); if (v) return v; } catch (e) {} return location.pathname.startsWith('/app') ? { url: location.origin, token: '' } : { url: '', token: '' }; })();
const srvListo = () => !!(S.srv.url && S.srv.token);
async function api(metodo, ruta, datos) {
  let r;
  try { r = await fetch(S.srv.url.replace(/\/$/, '') + ruta, { method: metodo, headers: { 'Authorization': 'Bearer ' + S.srv.token, 'Content-Type': 'application/json' }, body: datos ? JSON.stringify(datos) : undefined }); }
  catch (e) { const err = new Error('No se pudo llegar al servidor. Revisá la dirección y que esté encendido.'); err.red = true; throw err; }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && (typeof j.detail === 'string' ? j.detail : 'Datos inválidos')) || ('Error ' + r.status));
  return j;
}
async function sincronizar() {
  await traerPedidosDemo();
  if (!srvListo()) { S.srvOk = null; return; }
  try {
    const lista = await api('GET', '/api/equipos');
    S.srvEquipos = Object.fromEntries(lista.map(x => [x.id, x]));
    S.srvAlertas = await api('GET', '/api/eventos?solo_alertas=true&limite=50');
    S.srvOk = true; S.srvError = '';
    if (S.vinculo) { const x = eq(S.vinculo.id); const sv = x && S.srvEquipos[x.servidorId]; if (sv && sv.modulo && sv.modulo.conectado && (!S.vinculo.moduloAntes || sv.modulo.id !== S.vinculo.moduloAntes)) { toast('Módulo vinculado a ' + x.nombre); S.vinculo = null; } }
  } catch (e) { S.srvOk = false; S.srvError = e.message; }
  await traerVentasWeb();
  const activo = document.activeElement;
  if ((vistaActual() === 'equipos' || vistaActual() === 'ventas') && !(activo && activo.matches('input,select'))) render();
}
setInterval(sincronizar, 5000);
setTimeout(sincronizar, 300);

// Estado del módulo físico de una máquina de la app
function modulo(x) {
  if (!srvListo()) return { tipo: 'sin', texto: 'Sin módulo físico' };
  const sv = x.servidorId && S.srvEquipos[x.servidorId];
  if (!sv || !sv.modulo) return { tipo: 'sin', texto: 'Sin módulo físico', sv };
  return sv.modulo.conectado ? { tipo: 'ok', texto: 'Módulo conectado', sv } : { tipo: 'desc', texto: 'Módulo desconectado', sv };
}
function estadoEq(x) {  // con módulo, manda lo que dice el servidor
  const m = modulo(x);
  if (m.sv && m.sv.modulo) return { estado: m.sv.estado, fin: m.sv.fin_ms };
  return { estado: x.estado, fin: x.fin };
}

function vEquipos() {
  const lista = S.equipos.filter(x => x.activo !== false).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  const sinModulo = lista.filter(x => modulo(x).tipo === 'sin');
  const desconectados = lista.filter(x => modulo(x).tipo === 'desc');
  const nAlertas = sinModulo.length + desconectados.length + S.srvAlertas.length;
  const tabs = [['maquinas', 'Máquinas'], ['conectar', 'Conectar una máquina'], ['alertas', 'Alertas' + (nAlertas ? ` (${nAlertas})` : '')], ['servidor', 'Servidor']];
  const sub = `<div class="chips" role="tablist" style="margin-bottom:16px">${tabs.map(([k, l]) => `<button class="chip" role="tab" data-eq-tab="${k}" aria-pressed="${S.eqTab === k}">${l}</button>`).join('')}</div>`;
  const cuerpo = { maquinas: vMaquinas, conectar: vConectar, alertas: vAlertas, servidor: vServidor }[S.eqTab]({ lista, sinModulo, desconectados });
  return sub + cuerpo;
}

  const ini = new Date(); ini.setHours(0, 0, 0, 0);
  const hoy = S.ventas.filter(v => v.equipoId && !v.anulada && v.ts >= ini.getTime());
  const recaudo = id => r2(hoy.filter(v => v.equipoId === id).reduce((s, v) => s + v.total, 0));
  const usos = id => hoy.filter(v => v.equipoId === id).length;
  const enUso = lista.filter(x => estadoEq(x).estado === 'en_uso').length;
  const t = turnoAbierto();
  const e = S.eqEdit ? eq(S.eqEdit) : null;

    <label class="full">Nombre<input id="eq_nombre" required placeholder="Ej: Lavarropas 1" value="${esc(e ? e.nombre : '')}"></label>
    <label>Tipo<select id="eq_tipo">${TIPOS_EQ.map(x => `<option ${e && e.tipo === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
    <label>Ubicación<input id="eq_ubic" placeholder="Ej: Lavadero, fondo" value="${esc(e ? e.ubicacion || '' : '')}"></label>

    <label>Precio ($)<input id="eq_precio" type="number" min="0" step="0.01" required value="${e ? e.precio : ''}"></label>
    <label>Duración del ciclo (min)<input id="eq_min" type="number" min="1" step="1" value="${e ? e.minutos || 30 : 30}"></label>
    <p class="tiny muted full">Por uso: un precio fijo y la máquina funciona lo que dura el ciclo. Por minuto: el precio es por minuto y al cobrar se eligen los minutos.</p>
    <div class="row full"><button class="primary" type="submit">${e ? 'Guardar' : 'Agregar equipo'}</button><button type="button" data-eq-cancel>Cancelar</button>${e && modulo(e).sv && modulo(e).sv.modulo ? '<button type="button" data-eq-desvincular>Quitar módulo</button>' : ''}${e ? '<button type="button" class="danger" data-eq-baja>Dar de baja</button>' : ''}</div>
  </form></section>` : '';
  const vin = S.vinculo ? (() => { const x = eq(S.vinculo.id); const resta = S.vinculo.expira - Date.now(); return `<section class="panel vinculo" style="margin-bottom:16px"><h2>Vincular el módulo de ${esc(x ? x.nombre : '')}</h2>
    <div class="row" style="gap:24px;align-items:flex-start"><div><span class="tiny muted">Código</span><div class="codigo">${esc(S.vinculo.codigo)}</div><span class="tiny muted">${resta > 0 ? 'Vence en <span class="countdown-sm" data-fin="' + S.vinculo.expira + '">' + mmss(resta) + '</span>' : 'Venció: pedí otro'}</span></div>
    <ol class="pasos"><li>Enchufá el módulo de esa máquina y conectalo a la compu con el cable USB.</li><li>En el monitor serie escribí <code>vincular ${esc(S.vinculo.codigo)}</code>.</li><li>Esperá unos segundos: cuando se conecte, esta tarjeta se cierra sola y la máquina pasa a "Módulo conectado".</li></ol></div>
    <div class="row"><button data-eq-nuevocodigo="${S.vinculo.id}">Pedir otro código</button><button data-eq-cerrarvinculo>Cerrar</button></div></section>`; })() : '';

  ${form}${vin}
  ${lista.length ? `<div class="eqgrid">${lista.map(x => tarjetaEq(x, t, usos(x.id), recaudo(x.id))).join('')}</div>` : `<div class="empty">${S.loaded ? 'Todavía no hay equipos. Agregá uno: un lavarropas, una cafetera o lo que quieras cobrar por uso.' : 'Cargando equipos…'}</div>`}

function tarjetaEq(x, t, nUsos, recaudado) {
  const m = modulo(x), { estado, fin } = estadoEq(x);
  const p = S.eqPago && S.eqPago.id === x.id ? S.eqPago : null;
  const est = estado === 'en_uso' ? '<span class="pill ok">Funcionando</span>' : estado === 'fuera' ? '<span class="pill bad">Fuera de servicio</span>' : '<span class="pill off">Libre</span>';
  const modTag = m.tipo === 'ok' ? '<span class="tag good">Módulo conectado</span>' : m.tipo === 'desc' ? '<span class="tag bad">Módulo desconectado</span>' : '';
  const alerta = m.tipo === 'sin' ? `<div class="eqalerta"><b>Sin módulo físico.</b> Cobrar no enciende la máquina: solo registra la venta.${srvListo() ? ` <button class="small" data-eq-vincular="${x.id}">Vincular módulo</button>` : ' <a href="#equipos" data-eq-tab="servidor">Configurar servidor</a>'}</div>`
    : m.tipo === 'desc' ? '<div class="eqalerta bad"><b>El módulo no responde.</b> Revisá que la máquina tenga luz y Wi-Fi. No se puede cobrar hasta que vuelva.</div>' : '';
  let cuerpo = '';
  if (estado === 'en_uso') cuerpo = `<div class="countdown" data-fin="${fin || 0}">${mmss(Math.max(0, (fin || 0) - Date.now()))}</div><p class="tiny muted">Termina ${fin ? fecha(fin) : '—'}</p><button data-eq-detener="${x.id}">Detener ahora</button>`;
  else if (estado === 'fuera') cuerpo = `<p class="muted">No se puede cobrar hasta que vuelva a estar en servicio.</p><button data-eq-fuera="${x.id}">Volver a poner en servicio</button>`;
  else if (p && p.esperandoQR) cuerpo = `<div class="qrbox" aria-label="Código QR simulado"><div class="qrfake"></div><div><b>Esperando el pago con QR</b><br><span class="money">${fmt(p.monto)}</span><br><span class="tiny muted">Simulado: con Mercado Pago conectado, el aviso llega solo.</span></div></div>
      <div class="row"><button class="primary" data-eq-qrok="${x.id}">Simular pago recibido</button><button data-eq-cancelpago>Cancelar</button></div>`;
  else if (p) cuerpo = `<form id="eqCobroForm" class="stack" style="gap:10px">${x.modo === 'minuto' ? `<label>Minutos<input id="eqc_min" type="number" min="1" step="1" value="${p.minutos}"></label>` : ''}
      <div class="chips" role="group" aria-label="Medio de pago">${['QR Mercado Pago', ...MEDIOS.filter(m => m !== 'QR Mercado Pago')].map(md => `<button type="button" class="chip" data-eq-medio="${md}" aria-pressed="${p.medio === md}">${md}</button>`).join('')}</div>
      <div class="row"><button class="primary" type="submit">Cobrar ${fmt(precioEq(x, p.minutos))} y activar</button><button type="button" data-eq-cancelpago>Cancelar</button></div></form>`;
  else cuerpo = `<p class="money" style="font-size:20px;margin:0">${fmt(x.precio)} <span class="tiny muted">${x.modo === 'minuto' ? 'por minuto' : 'por uso · ' + (x.minutos || 30) + ' min'}</span></p>
      <div class="row"><button class="primary" data-eq-cobrar="${x.id}" ${!t || m.tipo === 'desc' ? 'disabled' : ''}>Cobrar y activar</button><button class="small" data-eq-fuera="${x.id}">Fuera de servicio</button></div>`;
  return `<article class="panel eqcard ${estado === 'en_uso' ? 'on' : ''}"><div class="row" style="justify-content:space-between"><div><b class="eqname">${esc(x.nombre)}</b><br><span class="tiny muted">${esc(x.tipo || '')}${x.ubicacion ? ' · ' + esc(x.ubicacion) : ''}</span></div><div class="stack" style="gap:4px;align-items:flex-end">${est}${modTag}</div></div>
    ${alerta}<div class="stack" style="gap:10px;margin-top:12px">${cuerpo}</div>
    <div class="row tiny muted" style="justify-content:space-between;margin-top:12px;border-top:1px solid var(--line);padding-top:8px"><span>Hoy: ${nUsos} usos · <span class="money">${fmt(recaudado)}</span></span>${estado !== 'en_uso' ? `<button class="small" data-eq-editar="${x.id}">Editar</button>` : ''}</div></article>`;
}

function vConectar() {
  return `<div class="grid2"><section class="panel"><h2>Cómo conectar una máquina</h2>
    <ol class="pasos">
      <li><b>Armar el módulo.</b> Cada máquina lleva una plaquita ESP32 con un relé, en una caja cerrada. Los materiales y las conexiones están en la <a href="${GUIA_URL}" target="_blank" rel="noopener">guía de la parte física</a>.</li>
      <li><b>Conectarlo a la máquina.</b> El módulo habilita la máquina con un relé: queda apagada hasta que entra el pago y se corta sola al terminar el tiempo. Lo que va a 220 V lo instala un electricista matriculado.</li>
      <li><b>Cargar el programa.</b> Con la compu y el cable USB se carga el firmware del módulo y se configuran el Wi-Fi y la dirección del servidor.</li>
      <li><b>Agregar la máquina acá.</b> En <a href="#equipos" data-eq-tab="maquinas">Máquinas</a>, tocá "Agregar equipo" y poné nombre, precio y duración.</li>
      <li><b>Vincular.</b> En la tarjeta de la máquina tocá "Vincular módulo". Aparece un código de 6 dígitos que vence en 10 minutos; se escribe en el módulo y listo.</li>
      <li><b>Cobrar con QR.</b> El cliente paga con el QR de Mercado Pago, en pesos. Cuando el pago entra, el servidor le da la orden al módulo y la máquina arranca.</li>
      <li><b>Probar.</b> Cobrá un uso: la máquina tiene que encenderse y apagarse sola al terminar el tiempo.</li>
    </ol></section>
    <section class="stack"><div class="panel"><h2>Qué controla el sistema</h2>
      <ul class="pasos"><li>Cada módulo tiene su propia clave: solo obedece a nuestro servidor.</li><li>El tiempo lo cuenta el módulo: si se corta internet, igual apaga a tiempo.</li><li>Un mismo pago no puede encender dos veces.</li><li>Avisa si la máquina funciona sin pago o si abren la caja del módulo.</li><li>Si el módulo deja de responder, la máquina no se puede cobrar.</li></ul></div>
    <div class="panel"><h2>Antes de instalar en clientes</h2><p class="muted" style="margin:0">Probá primero con un módulo en la mesa y un foquito, y después una semana en una sola máquina. Los pasos están en la <a href="${GUIA_URL}" target="_blank" rel="noopener">guía</a>.</p></div></section></div>`;

    ...S.srvAlertas.map(a => { const x = S.equipos.find(e => e.servidorId === a.equipo_id); return { cuando: fecha(a.ts), equipo: x ? x.nombre : 'Equipo ' + a.equipo_id, texto: ({ uso_sin_pago: 'Funcionó sin un pago registrado', tapa_abierta: 'Abrieron la caja del módulo', firma_invalida: 'Alguien intentó hablar en nombre del módulo', pedido_repetido: 'Se rechazó un pedido repetido' })[a.tipo] || a.detalle || a.tipo, clase: 'bad' }; })
  ];

}

async function guardarEquipo() {
  const v = id => document.getElementById(id).value;
  const nombre = v('eq_nombre').trim();
  if (!nombre) return toast('Falta el nombre del equipo');
  if (!(Number(v('eq_precio')) > 0)) return toast('Falta el precio');
  const data = { nombre, tipo: v('eq_tipo'), ubicacion: v('eq_ubic').trim(), modo: v('eq_modo'), precio: r2(v('eq_precio')), minutos: Math.max(1, Math.round(Number(v('eq_min')) || 30)), activo: true };
  if (S.eqEdit) {
    await S.db.doc('equipos/' + S.eqEdit).update(data);
    const x = eq(S.eqEdit);
    if (x && x.servidorId && srvListo()) { try { await api('PATCH', '/api/equipos/' + x.servidorId, { nombre: data.nombre, modo: data.modo, precio: data.precio, minutos: data.minutos }); } catch (e) { toast('Guardado en la app, pero no en el servidor: ' + e.message); } }
  } else await S.db.collection('equipos').add({ ...data, estado: 'libre', creado: Date.now() });
  toast((S.eqEdit ? 'Guardado: ' : 'Agregado: ') + nombre); S.eqEdit = null; S.eqNuevo = false; render();
}
async function asegurarEnServidor(x) {
  if (x.servidorId && S.srvEquipos[x.servidorId]) return x.servidorId;
  const sv = await api('POST', '/api/equipos', { nombre: x.nombre, modo: x.modo, precio: x.precio, minutos: x.minutos || 30 });
  await S.db.doc('equipos/' + x.id).update({ servidorId: sv.id });
  x.servidorId = sv.id; S.srvEquipos[sv.id] = sv;
  return sv.id;
}
async function pedirCodigo(id) {
  const x = eq(id); if (!x) return;
  try {
    const sid = await asegurarEnServidor(x);
    const c = await api('POST', '/api/equipos/' + sid + '/codigo');
    const sv = S.srvEquipos[sid];
    S.vinculo = { id, codigo: c.codigo, expira: c.expira_ms, moduloAntes: sv && sv.modulo ? sv.modulo.id : null };
    render(); window.scrollTo({ top: 0 });
  } catch (e) { toast(e.message); }
}
async function activarEquipo(id) {
  const x = eq(id), p = S.eqPago, t = turnoAbierto();
  if (!x || !p || !t || estadoEq(x).estado !== 'libre') return;
  const m = modulo(x);
  const min = x.modo === 'minuto' ? p.minutos : (x.minutos || 30);
  const monto = precioEq(x, min);
  const ts = Date.now(), ref = 'APP-' + ts.toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  try {
    if (m.tipo === 'desc') throw new Error('El módulo no responde: no se cobró');
    let real = false;
    if (m.tipo === 'ok') { await api('POST', '/api/equipos/' + x.servidorId + '/activar', { pago_ref: ref, medio: p.medio, monto, minutos: x.modo === 'minuto' ? min : null }); real = true; }
    const numero = (S.contadores.venta || 0) + 1;
    await S.db.doc('config/contadores').set({ ...S.contadores, venta: numero });
    const v = await S.db.collection('ventas').add({ numero, ts, equipoId: id, pagoRef: ref, encendidoReal: real, items: [{ productoId: 'equipo:' + id, nombre: x.nombre + (x.modo === 'minuto' ? ` · ${min} min` : ' · 1 uso'), cant: 1, precio: monto, costo: 0 }], total: monto, costo: 0, pago: p.medio, turnoId: t.id, anulada: false });

// Trae de la web los pedidos pagados y los registra como venta: descuenta stock y guarda el total pagado.
async function traerVentasWeb() {
  if (!srvListo() || !S.db || !S.loaded || S.webOcupado) return;
  S.webOcupado = true;
  try {
    const pend = (await api('GET', '/api/ventas-web?estado=pendiente')).reverse();
    S.webUltima = Date.now(); S.webError = '';
    const nuevos = [...S.webReintentar.splice(0), ...pend];
    for (const v of nuevos) {
      if (!v._tomada) {
        try { await api('POST', '/api/ventas-web/' + v.id + '/registrar'); } catch (e) { continue; }  // ya la registró otra compu
        v._tomada = true;
      }
      if (S.ventas.some(x => x.pedidoId === v.pedido_id)) continue;
      try { await registrarVentaWeb(v); } catch (e) { S.webReintentar.push(v); console.error(e); }
    }
  } catch (e) { S.webError = e.message; }
  finally { S.webOcupado = false; }
}

function resumenTurno(t) {
  const vs = S.ventas.filter(v => v.turnoId === t.id && !v.anulada);
  const porMedio = {}; MEDIOS.forEach(m => porMedio[m] = 0);
  vs.forEach(v => porMedio[v.pago] = r2((porMedio[v.pago] || 0) + v.total));
  const total = r2(vs.reduce((s, v) => s + v.total, 0));
  const egresos = r2((t.egresos || []).reduce((s, g) => s + g.monto, 0));
  const cobrosEf = r2(S.ctacte.filter(m => m.turnoId === t.id && m.medio === 'Efectivo').reduce((s, m) => s - m.importe, 0));
  const pagosProvEf = r2(S.ctaprov.filter(m => m.turnoId === t.id && m.medio === 'Efectivo').reduce((s, m) => s - m.importe, 0));
  const esperado = r2((t.inicial || 0) + porMedio['Efectivo'] + cobrosEf - egresos - pagosProvEf);
  return { vs, porMedio, total, egresos, cobrosEf, pagosProvEf, esperado };
}
function vCaja() {
  const t = turnoAbierto();

// ---------- guardado local (cuando la página se abre fuera de Claude) ----------
// Imita la parte de la API de base de datos que usa la app y guarda todo en localStorage.
function localDB() {
  const KEY = 'mostrador-datos-v1';
  let data;
  try { data = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; }
  const nuevo = !data;
  data = data || {};
  const subs = new Set();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { const err = new Error('No se pudo guardar'); err.code = e && e.name === 'QuotaExceededError' ? 'quota_exceeded' : 'unavailable'; throw err; } subs.forEach(f => f()); };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const split = p => { const i = p.lastIndexOf('/'); return [p.slice(0, i), p.slice(i + 1)]; };
  const meta = { fromCache: false, hasPendingWrites: false };
  const snapDoc = (id, d) => ({ id, exists: !!d, data: () => d ? JSON.parse(JSON.stringify(d)) : undefined, metadata: meta });
  const docRef = path => {
    const [c, id] = split(path);
    return {
      id, path,
      get: async () => snapDoc(id, (data[c] || {})[id]),
      set: async v => { (data[c] = data[c] || {})[id] = JSON.parse(JSON.stringify(v)); save(); },
      update: async v => { const cur = (data[c] || {})[id]; if (!cur) { const e = new Error('No existe'); e.code = 'invalid_argument'; throw e; } Object.assign(cur, JSON.parse(JSON.stringify(v))); save(); },
      delete: async () => { if (data[c]) delete data[c][id]; save(); },
      onSnapshot(next) { const f = () => next(snapDoc(id, (data[c] || {})[id])); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); }
    };
  };
  const coll = c => {
    const make = (ord, lim) => {
      const exec = () => {
        let docs = Object.entries(data[c] || {}).map(([id, d]) => snapDoc(id, d));
        if (ord) docs.sort((a, b) => { const x = a.data()[ord.f], y = b.data()[ord.f]; return (x > y ? 1 : x < y ? -1 : 0) * (ord.dir === 'desc' ? -1 : 1); });
        if (lim) docs = docs.slice(0, lim);
        return { docs, size: docs.length, empty: !docs.length, metadata: meta, docChanges: () => [] };
      };
      return {
        path: c,
        orderBy: (f, dir) => make({ f, dir: dir || 'asc' }, lim),
        limit: n => make(ord, n),
        get: async () => exec(),
        onSnapshot(next) { const f = () => next(exec()); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
        doc: id => docRef(c + '/' + (id || uid())),
        add: async v => { const id = uid(); (data[c] = data[c] || {})[id] = JSON.parse(JSON.stringify(v)); save(); return docRef(c + '/' + id); }
      };
    };
    return make(null, 0);
  };
  if (nuevo) {
    const ej = [['Agua mineral 500 ml', '7790001000011', 'Bebidas', 450, 800, 48, 12], ['Gaseosa cola 1,5 L', '7790001000028', 'Bebidas', 1500, 2600, 24, 6], ['Alfajor triple chocolate', '7790001000035', 'Golosinas', 600, 1100, 60, 20], ['Cargador de celular USB-C', '7790001000066', 'Accesorios', 5000, 9500, 8, 3], ['Hielo en bolsa 2 kg', '7790001000059', 'Varios', 800, 1800, 15, 5]];
    data.productos = {};
    ej.forEach(([nombre, cod, rubro, costo, precio, stock, minimo], i) => data.productos['ej' + (i + 1)] = { nombre, codigos: [cod], rubro, iva: 21, costo, precio, stock, minimo, controlaStock: true, porPeso: false, activo: true, ejemplo: true, creado: Date.now() });
    data.equipos = {};
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { return null; }
  }
  return { collection: coll, doc: docRef };
}

// ---------- datos ----------
render();
(async () => {
  let db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  if (!db) {
    db = localDB();
    if (!db) { $('#aviso').innerHTML = '<div class="notice bad" style="margin-bottom:16px">Este navegador no deja guardar datos. Probá con otro navegador o sin modo incógnito.</div>'; $('#estadoTurno').textContent = 'Sin datos'; return; }
    S.local = true;
  }
  S.db = db;
  const pend = new Set(['productos', 'ventas', 'movimientos', 'turnos', 'equipos', 'clientes', 'ctacte', 'presupuestos', 'remitos', 'proveedores', 'compras', 'ctaprov']);
  const timer = setTimeout(() => { if (pend.size) $('#estadoDatos').textContent = 'Los datos tardan en llegar; pueden estar desactualizados.'; }, 10000);
  const listo = (k, snap) => { if (!snap.metadata.fromCache) pend.delete(k); if (!pend.size) { clearTimeout(timer); $('#estadoDatos').textContent = S.local ? 'Datos guardados en este navegador' : ''; } S.loaded = true; render(); };
  const err = e => { clearTimeout(timer); $('#estadoDatos').textContent = 'Error al leer los datos'; console.error(e); };
  const docs = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
  db.collection('productos').limit(1000).onSnapshot(s => { S.productos = docs(s); listo('productos', s); }, err);
  db.collection('ventas').orderBy('ts', 'desc').limit(1000).onSnapshot(s => { S.ventas = docs(s); listo('ventas', s); }, err);
  db.collection('movimientos').orderBy('ts', 'desc').limit(400).onSnapshot(s => { S.movs = docs(s); listo('movimientos', s); }, err);
  db.collection('turnos').orderBy('apertura', 'desc').limit(40).onSnapshot(s => { S.turnos = docs(s); listo('turnos', s); }, err);
  db.collection('equipos').limit(500).onSnapshot(s => { S.equipos = docs(s); listo('equipos', s); }, err);
  db.collection('clientes').limit(2000).onSnapshot(s => { S.clientes = docs(s); listo('clientes', s); }, err);
  db.collection('ctacte').orderBy('ts', 'desc').limit(3000).onSnapshot(s => { S.ctacte = docs(s); listo('ctacte', s); }, err);
  db.collection('presupuestos').orderBy('ts', 'desc').limit(300).onSnapshot(s => { S.presupuestos = docs(s); listo('presupuestos', s); }, err);
  db.collection('remitos').orderBy('ts', 'desc').limit(500).onSnapshot(s => { S.remitos = docs(s); listo('remitos', s); }, err);
  db.collection('proveedores').limit(1000).onSnapshot(s => { S.proveedores = docs(s); listo('proveedores', s); }, err);
  db.collection('compras').orderBy('ts', 'desc').limit(500).onSnapshot(s => { S.compras = docs(s); listo('compras', s); }, err);
  db.collection('ctaprov').orderBy('ts', 'desc').limit(3000).onSnapshot(s => { S.ctaprov = docs(s); listo('ctaprov', s); }, err);
  db.doc('config/contadores').onSnapshot(s => { S.contadores = s.exists ? s.data() : {}; }, err);
})();
})();
</script>
