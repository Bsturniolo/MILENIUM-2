# Servidor + HTTPS automático. Ver docs/SUBIR-A-LA-NUBE.md
services:
  servidor:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - datos:/datos
    # No se publica el puerto 8000: solo Caddy (HTTPS) llega al servidor.

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      - servidor

volumes:
  datos:
  caddy_datos:
  caddy_config:
