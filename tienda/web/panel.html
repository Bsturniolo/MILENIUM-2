<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de la tienda</title>
<meta name="robots" content="noindex">
<style>
:root{
  --acc:#6c4cf1; --acc-soft:#eeeafe; --bg:#f5f4f1; --card:#fff; --tx:#1c1b22; --mut:#6b6a75; --line:#e6e3dc; --soft:#efede8;
  --ok:#1f8a5b; --ok-soft:#e3f4ec; --bad:#c23b3b; --bad-soft:#fbe7e7; --warn:#9a6400; --warn-soft:#fdf1d8;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --acc:#a693ff; --acc-soft:#2a2448; --bg:#121216; --card:#1b1b21; --tx:#efeef3; --mut:#a3a2ad; --line:#2c2c35; --soft:#24242b;
  --ok:#5fd39a; --ok-soft:#173327; --bad:#ff8c8c; --bad-soft:#3a1d1f; --warn:#f3c15e; --warn-soft:#382c12; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
a{color:var(--acc)}
.btn{color:var(--tx)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:0;flex-wrap:wrap}
header h1{font-size:18px;margin:0 12px 0 0}
nav{display:flex;gap:2px;overflow-x:auto;width:100%;margin-top:6px}
nav a{padding:9px 14px;color:var(--mut);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav a[aria-current="page"]{color:var(--acc);border-color:var(--acc)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--soft);color:var(--mut)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--acc-soft);color:var(--acc)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.panel h2{margin:0 0 12px;font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{display:block;color:var(--mut);font-size:13px} .kpi b{font-size:24px;font-variant-numeric:tabular-nums}
.dos{display:grid;gap:16px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
@media (max-width:860px){.dos{grid-template-columns:1fr}}
.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mut);font-weight:600}
td.r,th.r{text-align:right} .num{font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)} tr.sel td{background:var(--acc-soft)}
.mini{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--soft);display:block}
.muted{color:var(--mut)} .tiny{font-size:13px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:600}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;font-weight:400}
label textarea{min-height:90px;resize:vertical}
label.check{display:flex;gap:8px;align-items:center;font-weight:500}
label.check input{width:auto;margin:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{color:var(--bad)}
.btn.chico{padding:4px 10px;font-size:13px}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.fotos{display:flex;gap:8px;flex-wrap:wrap}
.fotos figure{margin:0;position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--soft)}
.fotos img{width:100%;height:100%;object-fit:cover}
.fotos figure button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.fotos .subir{width:84px;height:84px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--mut);font-size:13px;text-align:center;cursor:pointer;font-weight:500}
.fotos .subir input{display:none}
.aviso{border-radius:10px;padding:10px 12px;background:var(--soft);margin-top:12px;font-size:14px}
.aviso.warn{background:var(--warn-soft);color:var(--warn)} .aviso.bad{background:var(--bad-soft);color:var(--bad)} .aviso.ok{background:var(--ok-soft);color:var(--ok)}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.envio{display:grid;grid-template-columns:2fr 1fr auto auto;gap:8px;align-items:end;border-bottom:1px solid var(--line);padding:8px 0}
@media (max-width:560px){.envio{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}
code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:13px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:20}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plata = n => '$ ' + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fecha = ts => ts ? new Date(ts).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2800); };
const ESTADO = { esperando_pago: ['Esperando pago', 'warn'], pagado: ['Pagado · preparar', 'acc'], enviado: ['Enviado', 'ok'], entregado: ['Entregado', ''], cancelado: ['Cancelado', 'bad'] };

const S = { clave: (() => { try { return localStorage.getItem('tienda-panel-clave') || ''; } catch (e) { return ''; } })(), vista: 'inicio',
  resumen: null, pedidos: [], productos: [], config: null, filtro: 'pagado', sel: null, prodSel: null, form: null, buscar: '' };

async function api(metodo, ruta, datos) {
  let r;
  try { r = await fetch(ruta, { method: metodo, headers: { Authorization: 'Bearer ' + S.clave, 'Content-Type': 'application/json' }, body: datos ? JSON.stringify(datos) : undefined }); }
  catch (e) { throw new Error('No se pudo llegar al servidor.'); }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (r.status === 401) { S.clave = ''; dibujar(); throw new Error('Clave incorrecta'); }
  if (!r.ok) throw new Error(j && typeof j.detail === 'string' ? j.detail : (j && j.detail ? 'Revisá los datos: ' + (j.detail[0] && j.detail[0].loc ? j.detail[0].loc.slice(-1)[0] : '') : 'Error ' + r.status));
  return j;
}
async function traer() {
  const [resumen, pedidos, productos, config] = await Promise.all([api('GET', '/api/panel/resumen'), api('GET', '/api/panel/pedidos'), api('GET', '/api/panel/productos'), api('GET', '/api/panel/config')]);
  Object.assign(S, { resumen, pedidos, productos, config });
}

// ---------------------------------------------------------------- vistas
function dibujar() {
  if (!S.clave) {
    $('#app').innerHTML = `<form class="login" id="fLogin"><h1 style="margin:0 0 6px;font-size:22px">Panel de la tienda</h1><p class="muted" style="margin:0 0 16px">Escribí la clave del panel. Está en la ventana negra al arrancar, o en el archivo de configuración del servidor.</p>
      <label>Clave<input id="clave" type="password" autocomplete="current-password" required></label><button class="btn pri" style="width:100%;margin-top:14px;height:44px">Entrar</button></form>`;
    $('#clave').focus(); return;
  }
  const r = S.resumen || {};
  const tabs = [['inicio', 'Inicio'], ['pedidos', 'Pedidos' + (r.para_preparar ? ` (${r.para_preparar})` : '')], ['productos', 'Productos'], ['tienda', 'Mi tienda'], ['conexion', 'Conexión']];
  const foco = document.activeElement && document.activeElement.id, pos = foco && document.activeElement.selectionStart;
  $('#app').innerHTML = `<header><div class="wrap"><h1>${esc(S.config ? S.config.nombre : 'Tienda')}</h1>
    ${r.pagos === 'simulado' ? '<span class="pill warn">Pagos de prueba</span>' : r.pagos === 'manual' ? '<span class="pill">Pago a coordinar (sin Mercado Pago)</span>' : r.pagos ? '<span class="pill ok">Mercado Pago conectado</span>' : ''}
    <span style="margin-left:auto" class="fila"><a class="btn chico" href="/" target="_blank" rel="noopener" style="text-decoration:none">Ver la tienda ↗</a><button class="btn chico" id="salir">Salir</button></span>
    <nav>${tabs.map(([k, l]) => `<a href="#${k}" aria-current="${S.vista === k ? 'page' : 'false'}">${l}</a>`).join('')}</nav></div></header>
    <main class="wrap">${({ inicio: vInicio, pedidos: vPedidos, productos: vProductos, tienda: vTienda, conexion: vConexion })[S.vista]()}</main>`;
  if (foco && document.getElementById(foco)) { const el = document.getElementById(foco); el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) {} }
}

function vInicio() {
  const r = S.resumen; if (!r) return '<p class="muted">Cargando…</p>';
  const pendientes = S.pedidos.filter(p => p.estado === 'pagado');
  return `<div class="kpis"><div class="kpi"><span>Vendido hoy</span><b>${plata(r.hoy.total)}</b><span>${r.hoy.pedidos} pedidos</span></div>
    <div class="kpi"><span>Últimos 30 días</span><b>${plata(r.ultimos_30.total)}</b><span>${r.ultimos_30.pedidos} pedidos</span></div>
    <div class="kpi"><span>Para preparar</span><b>${r.para_preparar}</b><span>pagados sin enviar</span></div>
    <div class="kpi"><span>Productos sin stock</span><b>${r.sin_stock}</b><span>visibles en la tienda</span></div></div>
    ${r.pagos === 'simulado' ? '<div class="aviso warn">La tienda está en <b>modo prueba</b>: los pagos son simulados. Para cobrar de verdad hay que conectar Mercado Pago (ver la guía).</div>' : ''}
    ${r.conexion.errores ? `<div class="aviso bad">${r.conexion.errores} pedidos no se pudieron pasar al sistema conectado. Mirá <a href="#conexion">Conexión</a>.</div>` : ''}
    ${!S.productos.length ? '<div class="aviso">Todavía no cargaste productos. Empezá por <a href="#productos">Productos</a> y después completá <a href="#tienda">Mi tienda</a> (nombre, WhatsApp y formas de entrega).</div>' : ''}
    <section class="panel"><h2>Pedidos para preparar</h2>${pendientes.length ? tablaPedidos(pendientes) : '<p class="muted">No hay pedidos pagados esperando. 🎉</p>'}</section>`;
}

function tablaPedidos(lista) {
  return `<div class="tabla"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Estado</th><th class="r">Total</th></tr></thead><tbody>
    ${lista.map(p => { const [l, c] = ESTADO[p.estado]; return `<tr class="click${S.sel === p.numero ? ' sel' : ''}" data-pedido="${esc(p.numero)}"><td><b>${esc(p.numero)}</b><br><span class="tiny muted">${fecha(p.ts)}</span></td>
      <td>${esc(p.cliente.nombre)}<br><span class="tiny muted">${esc(p.items.map(i => i.cantidad + ' ' + i.nombre).join(', '))}</span></td><td><span class="pill ${c}">${l}</span></td><td class="r num">${plata(p.total)}</td></tr>`; }).join('')}</tbody></table></div>`;
}

function vPedidos() {
  const filtros = [['pagado', 'Para preparar'], ['esperando_pago', 'Esperando pago'], ['enviado', 'Enviados'], ['entregado', 'Entregados'], ['cancelado', 'Cancelados'], ['', 'Todos']];
  const lista = S.pedidos.filter(p => !S.filtro || p.estado === S.filtro);
  const p = S.pedidos.find(x => x.numero === S.sel);
  return `<div class="dos"><section class="panel"><div class="chips" style="margin-bottom:10px">${filtros.map(([k, l]) => `<button class="chip" data-filtro="${k}" aria-pressed="${S.filtro === k}">${l} (${k ? S.pedidos.filter(x => x.estado === k).length : S.pedidos.length})</button>`).join('')}</div>
    ${lista.length ? tablaPedidos(lista) : '<p class="muted">No hay pedidos acá.</p>'}</section>
    <section class="panel">${p ? vPedido(p) : '<h2>Detalle</h2><p class="muted">Tocá un pedido para ver los datos del cliente y cambiar su estado.</p>'}</section></div>`;
}

function vPedido(p) {
  const c = p.cliente, [l, cl] = ESTADO[p.estado];
  const tel = (c.telefono || '').replace(/\D/g, '');
  const wsp = tel ? `https://wa.me/${tel.length <= 10 ? '549' + tel.replace(/^0/, '') : tel}?text=${encodeURIComponent(`Hola ${c.nombre}! Te escribo por tu pedido ${p.numero}.`)}` : '';
  const acciones = { esperando_pago: [['pagado', 'Marcar pagado'], ['cancelado', 'Cancelar']], pagado: [['enviado', 'Marcar enviado / listo para retirar'], ['cancelado', 'Cancelar y devolver stock']], enviado: [['entregado', 'Marcar entregado'], ['cancelado', 'Cancelar y devolver stock']], entregado: [], cancelado: [] }[p.estado];
  return `<h2>Pedido ${esc(p.numero)} <span class="pill ${cl}">${l}</span></h2><p class="tiny muted" style="margin-top:-6px">${fecha(p.ts)}${p.pago_ts ? ' · pagado ' + fecha(p.pago_ts) : ''}${p.pago_medio ? ' · ' + esc(p.pago_medio) : ''}${p.pago_id ? ' · operación ' + esc(p.pago_id) : ''}</p>
    <p style="margin:0 0 10px"><b>${esc(c.nombre)}</b><br><a href="mailto:${esc(c.email)}">${esc(c.email)}</a> · ${esc(c.telefono)}<br>
    <b>${esc(p.envio_nombre)}</b>${c.direccion ? ': ' + esc(c.direccion) : ''}${c.notas ? `<br><span class="muted">Nota: ${esc(c.notas)}</span>` : ''}</p>
    <table><tbody>${p.items.map(i => `<tr><td>${i.cantidad} × ${esc(i.nombre)}${i.codigo ? `<br><span class="tiny muted">${esc(i.codigo)}</span>` : ''}</td><td class="r num">${plata(i.precio * i.cantidad)}</td></tr>`).join('')}
    <tr><td>Envío</td><td class="r num">${plata(p.envio)}</td></tr><tr><td><b>Total</b></td><td class="r num"><b>${plata(p.total)}</b></td></tr></tbody></table>
    <div class="fila" style="margin-top:12px">${acciones.map(([e, t]) => `<button class="btn ${e === 'cancelado' ? 'bad' : 'pri'}" data-estado="${e}" data-num="${esc(p.numero)}">${t}</button>`).join('')}${wsp ? `<a class="btn" style="text-decoration:none" href="${wsp}" target="_blank" rel="noopener">WhatsApp al cliente</a>` : ''}</div>
    ${p.aviso_estado !== 'no' ? `<div class="aviso ${p.aviso_estado === 'ok' ? 'ok' : p.aviso_estado === 'error' ? 'bad' : 'warn'}">Sistema conectado: ${p.aviso_estado === 'ok' ? 'registrado ✓' : p.aviso_estado === 'pendiente' ? 'pendiente, se reintenta solo' : 'no se pudo pasar'}${p.aviso_error ? ` (${esc(p.aviso_error)})` : ''}${p.aviso_estado !== 'ok' ? ` <button class="btn chico" data-reavisar="${esc(p.numero)}">Reintentar ahora</button>` : ''}</div>` : ''}`;
}

function vProductos() {
  const q = S.buscar.trim().toLowerCase();
  const lista = S.productos.filter(p => !q || (p.nombre + ' ' + p.codigo + ' ' + p.categoria).toLowerCase().includes(q));
  const e = S.productos.find(p => p.id === S.prodSel);
  const f = S.form || (e ? { ...e, fotos: [...e.fotos] } : { codigo: '', nombre: '', descripcion: '', categoria: '', precio: '', precio_antes: '', stock: '', controla_stock: true, fotos: [], visible: true, destacado: false });
  S.form = f;
  const cats = [...new Set(S.productos.map(p => p.categoria).filter(Boolean))].sort();
  return `<div class="dos"><section class="panel"><div class="fila" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Productos (${S.productos.length})</h2>
    <span class="fila"><input id="buscar" placeholder="Buscar" value="${esc(S.buscar)}" style="border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 10px"><button class="btn pri" data-nuevo>+ Nuevo</button></span></div>
    ${lista.length ? `<div class="tabla"><table><thead><tr><th></th><th>Producto</th><th class="r">Precio</th><th class="r">Stock</th></tr></thead><tbody>${lista.map(p => `<tr class="click${S.prodSel === p.id ? ' sel' : ''}" data-prod="${p.id}">
      <td style="width:50px">${p.fotos[0] ? `<img class="mini" src="${esc(p.fotos[0])}" alt="">` : '<div class="mini"></div>'}</td>
      <td>${esc(p.nombre)} ${p.visible ? '' : '<span class="pill">oculto</span>'} ${p.destacado ? '<span class="pill acc">destacado</span>' : ''}<br><span class="tiny muted">${esc([p.codigo, p.categoria].filter(Boolean).join(' · '))}</span></td>
      <td class="r num">${plata(p.precio)}</td><td class="r num">${p.controla_stock ? (p.stock <= 0 ? '<span class="pill bad">0</span>' : p.stock + (p.disponible < p.stock ? `<br><span class="tiny muted">${p.stock - p.disponible} apartado</span>` : '')) : '<span class="tiny muted">no controla</span>'}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="muted">Todavía no hay productos. Tocá "+ Nuevo".</p>'}</section>
  <section class="panel"><h2>${e ? 'Editar producto' : 'Nuevo producto'}</h2>
    <form id="fProd" class="form">
      <label class="full">Nombre<input id="p_nombre" required value="${esc(f.nombre)}"></label>
      <div class="full"><label style="margin-bottom:6px">Fotos (la primera es la principal)</label><div class="fotos">${f.fotos.map((u, i) => `<figure><img src="${esc(u)}" alt=""><button type="button" data-sacar-foto="${i}" aria-label="Sacar foto">×</button></figure>`).join('')}
        ${f.fotos.length < 8 ? '<label class="subir">+ Subir foto<input type="file" id="p_foto" accept="image/*" multiple></label>' : ''}</div></div>
      <label>Precio ($)<input id="p_precio" type="number" min="0" step="0.01" inputmode="decimal" required value="${esc(f.precio)}"></label>
      <label>Precio antes ($) <span class="muted tiny">para mostrar oferta</span><input id="p_precio_antes" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(f.precio_antes || '')}"></label>
      ${e ? `<div class="full"><label>Stock: <b class="num">${e.stock}</b></label><div class="fila" style="margin-top:4px"><input id="aj_cant" type="number" step="1" placeholder="+5 o -2" style="width:110px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px"><input id="aj_mot" placeholder="Motivo (ej: llegó mercadería)" style="flex:1;min-width:140px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px"><button type="button" class="btn" data-ajustar>Ajustar stock</button></div></div>`
        : `<label>Stock inicial<input id="p_stock" type="number" min="0" step="1" value="${esc(f.stock)}"></label>`}
      <label>Categoría<input id="p_categoria" list="cats" value="${esc(f.categoria)}"><datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></label>
      <label>Código / SKU <span class="muted tiny">igual que en Milenium 2</span><input id="p_codigo" value="${esc(f.codigo)}"></label>
      <label class="full">Descripción<textarea id="p_descripcion">${esc(f.descripcion)}</textarea></label>
      <label class="check full"><input type="checkbox" id="p_visible" ${f.visible ? 'checked' : ''}> Se ve en la tienda</label>
      <label class="check full"><input type="checkbox" id="p_destacado" ${f.destacado ? 'checked' : ''}> Destacado (aparece primero)</label>
      <label class="check full"><input type="checkbox" id="p_controla" ${f.controla_stock ? 'checked' : ''}> Controla stock (si no hay, no se puede comprar)</label>
      <div class="fila full"><button class="btn pri">${e ? 'Guardar cambios' : 'Agregar producto'}</button>${e ? '<button type="button" class="btn" data-cancelar>Cancelar</button><button type="button" class="btn bad" data-borrar>Borrar</button>' : ''}</div>
    </form></section></div>`;
}

function vTienda() {
  const c = S.config; if (!c) return '';
  return `<section class="panel" style="max-width:760px"><h2>Mi tienda</h2><form id="fConfig" class="form">
    <label>Nombre<input id="c_nombre" required value="${esc(c.nombre)}"></label>
    <label>Frase corta <span class="muted tiny">debajo del nombre</span><input id="c_lema" value="${esc(c.lema)}"></label>
    <label class="full">Cartel de arriba <span class="muted tiny">opcional, ej: "Envíos a todo Mendoza"</span><input id="c_aviso" value="${esc(c.aviso)}"></label>
    <label>WhatsApp <span class="muted tiny">con 549 y sin espacios, ej: 5492611234567</span><input id="c_whatsapp" inputmode="numeric" value="${esc(c.whatsapp)}"></label>
    <label>Instagram <span class="muted tiny">usuario</span><input id="c_instagram" value="${esc(c.instagram)}"></label>
    <label>Email de contacto<input id="c_email" type="email" value="${esc(c.email)}"></label>
    <label>Color principal<input id="c_color" type="color" value="${esc(c.color)}" style="height:40px;padding:3px"></label>
    <label class="full">Cómo pagar si no hay Mercado Pago <span class="muted tiny">se muestra al terminar la compra (alias, CBU, efectivo al retirar)</span><textarea id="c_instr">${esc(c.instrucciones_pago)}</textarea></label>
    <div class="full"><b>Formas de entrega</b><p class="tiny muted" style="margin:2px 0 6px">Poné el precio que cobrás; 0 = gratis. Si es envío, tildá "pide dirección".</p>
      <div id="envios">${c.envios.map((e, i) => `<div class="envio" data-i="${i}"><label>Nombre<input data-env="nombre" value="${esc(e.nombre)}"></label><label>Precio ($)<input data-env="precio" type="number" min="0" step="0.01" value="${esc(e.precio)}"></label>
        <label class="check"><input type="checkbox" data-env="pide_direccion" ${e.pide_direccion ? 'checked' : ''}> pide dirección</label><button type="button" class="btn chico bad" data-sacar-envio="${i}" ${c.envios.length < 2 ? 'disabled' : ''}>Sacar</button>
        <label style="grid-column:1/-1">Detalle <span class="muted tiny">opcional, ej: "Llega en 24 a 48 hs"</span><input data-env="detalle" value="${esc(e.detalle)}"></label></div>`).join('')}</div>
      <button type="button" class="btn chico" style="margin-top:8px" data-agregar-envio>+ Agregar forma de entrega</button></div>
    <div class="full"><button class="btn pri">Guardar</button></div></form></section>`;
}

function vConexion() {
  const r = S.resumen; if (!r) return '';
  const k = r.conexion;
  return `<section class="panel" style="max-width:760px"><h2>Cobros</h2>
    <p>${r.pagos === 'mercadopago' ? '<span class="pill ok">Mercado Pago conectado</span> Los clientes pagan con Mercado Pago y el pedido se marca pagado solo.' : r.pagos === 'simulado' ? '<span class="pill warn">Modo prueba</span> Los pagos son simulados: sirve para probar todo sin cobrar.' : '<span class="pill">Sin Mercado Pago</span> Los pedidos quedan "esperando pago" y los marcás pagados a mano cuando te transfieren.'}</p>
    <p class="tiny muted">Para conectar Mercado Pago hay que poner la clave (Access Token) en la configuración del servidor. Paso a paso en la guía <code>tienda/docs/PASOS.md</code>.</p></section>
    <section class="panel" style="max-width:760px"><h2>Sistema conectado (opcional)</h2>
    ${k.activa ? `<p><span class="pill ok">Conectado</span> Cada pedido pagado se manda a <code>${esc(k.url)}</code> para que quede registrado como venta y descuente el stock allá.</p>
      ${k.pendientes ? `<div class="aviso warn">${k.pendientes} pedidos esperando para pasar (se reintenta solo cada minuto).</div>` : ''}${k.errores ? `<div class="aviso bad">${k.errores} pedidos no se pudieron pasar. Abrilos en Pedidos y tocá "Reintentar ahora".</div>` : ''}`
      : `<p>La tienda funciona sola. Si querés que cada venta también quede en <b>Milenium 2</b> (u otro sistema), se configura en el servidor con dos datos: la dirección (<code>CONECTAR_URL</code>) y una clave compartida (<code>CONECTAR_CLAVE</code>). Paso a paso en la guía.</p>`}
    <p class="tiny muted">Los productos se reconocen por el <b>código / SKU</b>: tiene que ser el mismo en la tienda y en el sistema.</p></section>`;
}

// ---------------------------------------------------------------- fotos: se achican en el navegador antes de subir
function achicar(archivo) {
  return new Promise((ok, mal) => {
    const img = new Image(), url = URL.createObjectURL(archivo);
    img.onload = () => { const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.85)); };
    img.onerror = () => mal(new Error('No se pudo leer la imagen'));
    img.src = url;
  });
}
function leerProd() {
  const v = id => (document.getElementById(id) || {}).value, ch = id => !!(document.getElementById(id) || {}).checked;
  Object.assign(S.form, { nombre: v('p_nombre') || '', codigo: v('p_codigo') || '', categoria: v('p_categoria') || '', descripcion: v('p_descripcion') || '', precio: v('p_precio') || '', precio_antes: v('p_precio_antes') || '', visible: ch('p_visible'), destacado: ch('p_destacado'), controla_stock: ch('p_controla') });
  if (document.getElementById('p_stock')) S.form.stock = v('p_stock');
}
function leerEnvios() {
  return [...document.querySelectorAll('.envio')].map((d, i) => { const g = k => d.querySelector(`[data-env="${k}"]`); const nombre = g('nombre').value.trim(); return { id: (S.config.envios[i] && S.config.envios[i].id) || nombre.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) || 'envio' + i, nombre, precio: Number(g('precio').value) || 0, pide_direccion: g('pide_direccion').checked, detalle: g('detalle').value.trim() }; });
}
function leerConfig() {
  const v = id => document.getElementById(id).value.trim();
  return { nombre: v('c_nombre'), lema: v('c_lema'), aviso: v('c_aviso'), whatsapp: v('c_whatsapp').replace(/\D/g, ''), instagram: v('c_instagram').replace(/^@/, ''), email: v('c_email'), color: v('c_color'), instrucciones_pago: document.getElementById('c_instr').value.trim(), envios: leerEnvios() };
}

// ---------------------------------------------------------------- eventos
document.addEventListener('click', async e => {
  const b = e.target.closest('button,tr.click'); if (!b) return;
  const d = b.dataset;
  try {
    if (b.id === 'salir') { S.clave = ''; try { localStorage.removeItem('tienda-panel-clave'); } catch (er) {} dibujar(); }
    else if (d.pedido) { S.sel = d.pedido; if (S.vista !== 'pedidos') { S.filtro = S.pedidos.find(p => p.numero === d.pedido).estado; location.hash = 'pedidos'; } else dibujar(); }
    else if (d.filtro !== undefined) { S.filtro = d.filtro; dibujar(); }
    else if (d.estado) {
      if (d.estado === 'cancelado' && !confirm('¿Cancelar el pedido? Si estaba pagado, el stock vuelve. La devolución de la plata se hace desde Mercado Pago.')) return;
      const p = await api('POST', `/api/panel/pedidos/${encodeURIComponent(d.num)}/estado`, { estado: d.estado }); toast('Pedido ' + ESTADO[p.estado][0].toLowerCase()); await traer(); dibujar();
    }
    else if (d.reavisar) { await api('POST', `/api/panel/pedidos/${encodeURIComponent(d.reavisar)}/reavisar`); await traer(); dibujar(); }
    else if (d.prod) { S.prodSel = Number(d.prod); S.form = null; dibujar(); }
    else if (d.nuevo !== undefined || d.cancelar !== undefined) { S.prodSel = null; S.form = null; dibujar(); }
    else if (d.sacarFoto !== undefined) { leerProd(); S.form.fotos.splice(Number(d.sacarFoto), 1); dibujar(); }
    else if (d.borrar !== undefined) { if (!confirm('¿Borrar el producto? Deja de verse en la tienda. Los pedidos viejos no cambian.')) return; await api('DELETE', '/api/panel/productos/' + S.prodSel); S.prodSel = null; S.form = null; await traer(); dibujar(); toast('Borrado'); }
    else if (d.ajustar !== undefined) { const n = Number($('#aj_cant').value), m = $('#aj_mot').value.trim(); if (!n) return toast('Escribí cuánto sumar o restar'); leerProd(); await api('POST', `/api/panel/productos/${S.prodSel}/stock`, { cantidad: n, motivo: m || 'Ajuste' }); await traer(); dibujar(); toast('Stock actualizado'); }
    else if (d.agregarEnvio !== undefined) { S.config = { ...leerConfig() }; S.config.envios.push({ id: 'envio-' + Date.now().toString(36), nombre: 'Envío a domicilio', precio: 0, pide_direccion: true, detalle: '' }); dibujar(); }
    else if (d.sacarEnvio !== undefined) { S.config = { ...leerConfig() }; S.config.envios.splice(Number(d.sacarEnvio), 1); dibujar(); }
  } catch (er) { toast(er.message); }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'p_foto') return;
  leerProd();
  for (const f of [...e.target.files].slice(0, 8 - S.form.fotos.length)) {
    try { toast('Subiendo foto…'); const r = await api('POST', '/api/panel/fotos', { data_url: await achicar(f) }); S.form.fotos.push(r.url); } catch (er) { toast(er.message); }
  }
  dibujar();
});
document.addEventListener('input', e => { if (e.target.id === 'buscar') { S.buscar = e.target.value; leerProd(); dibujar(); } });
document.addEventListener('submit', async e => {
  e.preventDefault();
  try {
    if (e.target.id === 'fLogin') { S.clave = $('#clave').value.trim(); await traer(); try { localStorage.setItem('tienda-panel-clave', S.clave); } catch (er) {} dibujar(); }
    else if (e.target.id === 'fProd') {
      leerProd(); const f = S.form;
      const datos = { nombre: f.nombre.trim(), codigo: f.codigo.trim(), categoria: f.categoria.trim(), descripcion: f.descripcion, precio: Number(f.precio), precio_antes: Number(f.precio_antes) || 0, fotos: f.fotos, visible: f.visible, destacado: f.destacado, controla_stock: f.controla_stock };
      if (!datos.nombre) return toast('Falta el nombre'); if (!(datos.precio > 0)) return toast('Falta el precio');
      if (S.prodSel) await api('PATCH', '/api/panel/productos/' + S.prodSel, datos);
      else { const p = await api('POST', '/api/panel/productos', { ...datos, stock: Number(f.stock) || 0 }); S.prodSel = p.id; }
      S.form = null; await traer(); dibujar(); toast('Guardado');
    }
    else if (e.target.id === 'fConfig') { S.config = await api('PUT', '/api/panel/config', leerConfig()); await traer(); dibujar(); toast('Guardado'); }
  } catch (er) { toast(er.message); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['inicio', 'pedidos', 'productos', 'tienda', 'conexion'].includes(h)) { S.vista = h; dibujar(); } });
{ const h = location.hash.slice(1); if (['inicio', 'pedidos', 'productos', 'tienda', 'conexion'].includes(h)) S.vista = h; }

// Revisa pedidos nuevos cada 20 segundos (sin redibujar mientras se escribe).
setInterval(async () => { if (!S.clave) return; const a = document.activeElement; if (a && a.matches('input,textarea,select')) return; const antes = S.resumen && S.resumen.para_preparar; try { await traer(); } catch (e) { return; } if (S.resumen.para_preparar > (antes || 0)) toast('¡Entró un pedido nuevo!'); if (S.vista !== 'productos' && S.vista !== 'tienda') dibujar(); }, 20000);
(async () => { if (S.clave) { try { await traer(); } catch (e) {} } dibujar(); })();
})();
</script>
